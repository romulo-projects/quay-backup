---
- name: 1.Backup Red Hat Quay on OpenShift
  hosts: localhost
  gather_facts: true

  vars:
    backup_files:
      quay_registry: quay-registry.yaml
      managed_secret_keys: managed_secret_keys.yaml
      config_bundle: config-bundle.yaml
      quay_config: quay_config.yaml
      quay_bundle_config: quay_bundle_config.yaml
      quay_database_sql: backup.sql

  tasks:
    - name: 2.Validate that oc is available
      ansible.builtin.command: oc version --client
      changed_when: false

    - name: 3.Validate cluster access
      ansible.builtin.command: oc whoami
      changed_when: false

    - name: 4.Create backup directory
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        mode: "0700"

    - name: 5.Get QuayRegistry custom resource
      ansible.builtin.command:
        cmd: >
          oc get quayregistry {{ quay_instance }}
          -n {{ quay_namespace }} -o yaml
      register: quay_registry_backup
      changed_when: false

    - name: 6.Save QuayRegistry backup
      ansible.builtin.copy:
        content: "{{ quay_registry_backup.stdout }}"
        dest: "{{ backup_dir }}/{{ backup_files.quay_registry }}"
        mode: "0600"

    - name: 7.Get managed keys secret
      ansible.builtin.command:
        cmd: >
          oc get secret {{ quay_instance }}-quay-registry-managed-secret-keys
          -n {{ quay_namespace }} -o yaml
      register: managed_keys_backup
      changed_when: false

    - name: 8.Save managed keys secret backup
      ansible.builtin.copy:
        content: "{{ managed_keys_backup.stdout }}"
        dest: "{{ backup_dir }}/{{ backup_files.managed_secret_keys }}"
        mode: "0600"

    - name: 9.Get config bundle secret name
      ansible.builtin.command:
        cmd: >
          oc get quayregistry {{ quay_instance }}
          -n {{ quay_namespace }}
          -o jsonpath='{.spec.configBundleSecret}'
      register: config_bundle_secret_name
      changed_when: false

    - name: 10.Validate that the config bundle secret was found
      ansible.builtin.assert:
        that:
          - config_bundle_secret_name.stdout | length > 0
        fail_msg: "Não foi possível obter .spec.configBundleSecret do QuayRegistry."

    - name: 11.Get config bundle secret
      ansible.builtin.command:
        cmd: >
          oc get secret {{ config_bundle_secret_name.stdout }}
          -n {{ quay_namespace }} -o yaml
      register: config_bundle_backup
      changed_when: false

    - name: 12.Save config bundle secret backup
      ansible.builtin.copy:
        content: "{{ config_bundle_backup.stdout }}"
        dest: "{{ backup_dir }}/{{ backup_files.config_bundle }}"
        mode: "0600"

    - name: 13.Get bundle config.yaml values
      ansible.builtin.command:
        cmd: >
          oc extract secret/{{ config_bundle_secret_name.stdout }} -n {{ quay_namespace }} --keys=config.yaml --to=-
      register: config_bundle_values
      changed_when: false

    - name: 14.Save config bundle values backup
      ansible.builtin.copy:
        content: "{{ config_bundle_values.stdout }}"
        dest: "{{ backup_dir }}/{{ backup_files.quay_bundle_config }}"
        mode: "0600"

    - name: 15.Get Quay application pod
      ansible.builtin.command:
        cmd: >
          oc get pods -l {{ quay_pod_label }}
          -n {{ quay_namespace }}
          -o jsonpath='{.items[0].metadata.name}'
      register: quay_app_pod
      changed_when: false

    - name: 16.Validate that the Quay pod was found
      ansible.builtin.assert:
        that:
          - quay_app_pod.stdout | length > 0
        fail_msg: "Nenhum pod encontrado com label '{{ quay_pod_label }}' no namespace '{{ quay_namespace }}'."

    - name: 17.Get config.yaml from Quay pod
      ansible.builtin.command:
        cmd: >
          oc exec {{ quay_app_pod.stdout }}
          -n {{ quay_namespace }} -- cat /conf/stack/config.yaml
      register: quay_config_backup
      changed_when: false

    - name: 18.Save config.yaml backup
      ansible.builtin.copy:
        content: "{{ quay_config_backup.stdout }}"
        dest: "{{ backup_dir }}/{{ backup_files.quay_config }}"
        mode: "0600"

    - name: 19.Add readonly variables to the end of config.yaml
      ansible.builtin.lineinfile:
        path: "{{ backup_dir }}/{{ backup_files.quay_bundle_config }}"
        regexp: '^{{ item.key }}:'
        line: "{{ item.key }}: {{ item.value }}"
        insertafter: EOF
      loop: "{{ quay_readonly_config | dict2items }}"
      tags:
        - readonly_config
        - readonly_add

    - name: 20.Apply quay_bundle_config.yaml
      ansible.builtin.command:
        cmd: >
          oc set data secret/{{ config_bundle_secret_name.stdout }}
          -n {{ quay_namespace }}
          --from-file=config.yaml={{ backup_dir }}/{{ backup_files.quay_bundle_config }}

    - name: 21.Wait for the Operator to start a new Quay rollout
      shell: >
        oc rollout status deployment/{{ quay_instance }}-quay-app
        -n {{ quay_namespace }} --timeout=5s
      register: rollout_read_only_start
      retries: 60
      delay: 5
      until: "'successfully rolled out' not in rollout_read_only_start.stdout"
      changed_when: false
      failed_when: false

    - name: 22.Rollout not started
      fail:
        msg: "O Operator não iniciou um novo rollout do deployment {{ quay_instance }}-quay-app, necessario verifificar manualmente."
      when: "'successfully rolled out' in rollout_read_only_start.stdout"

    - name: 23.Wait for Quay to start as **ReadOnly**
      shell: >
        oc rollout status deployment/{{ quay_instance }}-quay-app
        -n {{ quay_namespace }} --timeout=5s
      register: rollout_read_only_status
      retries: 80
      delay: 5
      until: "'successfully rolled out' in rollout_read_only_status.stdout"
      changed_when: false
      failed_when: false

    - name: 24.Rollout not finished
      fail:
        msg: "Rollout do deployment {{ quay_instance }}-quay-app, nao finalizado no tempo esperado, necessario verifificar manualmente."
      when: "'successfully rolled out' not in rollout_read_only_status.stdout"      

    - name: 25.Get Quay database name
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - -c
          - |
              import re
              import sys
              from urllib.parse import urlsplit

              import yaml

              with open(sys.argv[1], encoding="utf-8") as config_file:
                  config = yaml.safe_load(config_file) or {}

              database_uri = config.get("DB_URI")
              if not isinstance(database_uri, str) or not database_uri:
                  raise SystemExit("DB_URI was not found in the saved Quay configuration")

              database_name = urlsplit(database_uri).path.lstrip("/")
              if not re.fullmatch(r"[A-Za-z0-9_.-]+", database_name):
                  raise SystemExit("A safe database name could not be extracted from DB_URI")

              print(database_name)
          - "{{ backup_dir }}/{{ backup_files.quay_config }}"
      register: quay_database_name
      changed_when: false

    - name: 25.1.Validate Quay database name
      ansible.builtin.assert:
        that:
          - quay_database_name.stdout | length > 0
          - quay_database_name.stdout is match('^[A-Za-z0-9_.-]+$')
        fail_msg: >-
          The Quay database name could not be safely detected from the saved
          quay_config.yaml file. The database dump was not started.

    - name: 26.Get Quay database pod name
      shell: >
        oc get pod -l quay-component=postgres -n {{ quay_namespace }} -o jsonpath='{.items[0].metadata.name}'
      register: quay_database_pod_name
      changed_when: false

    - name: 26.1.Validate Quay database pod name
      ansible.builtin.assert:
        that:
          - quay_database_pod_name.stdout | length > 0
          - quay_database_pod_name.stdout is match('^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$')
        fail_msg: "A safe managed PostgreSQL pod name could not be detected."

    - name: 27.Dump Quay database
      shell: >
        umask 077 && oc -n {{ quay_namespace }} exec
        {{ quay_database_pod_name.stdout }} -- /usr/bin/pg_dump
        -C {{ quay_database_name.stdout }} >
        {{ backup_dir }}/{{ backup_files.quay_database_sql }}
      changed_when: false

    - name: 27.1.Protect Quay database dump
      ansible.builtin.file:
        path: "{{ backup_dir }}/{{ backup_files.quay_database_sql }}"
        mode: "0600"

    - name: 28.Get noobaa s3 AWS_ACCESS_KEY_ID
      ansible.builtin.shell: >
        oc get secret -l app=noobaa -n {{ quay_namespace }}
        -o jsonpath='{.items[0].data.AWS_ACCESS_KEY_ID}' | base64 -d
      register: aws_access_key_id
      changed_when: false
      no_log: true
      when: s3_bucket_odf | bool

    - name: 29.Get noobaa s3 AWS_SECRET_ACCESS_KEY
      ansible.builtin.shell: >
        oc get secret -l app=noobaa -n {{ quay_namespace }}
        -o jsonpath='{.items[0].data.AWS_SECRET_ACCESS_KEY}' | base64 -d
      register: aws_secret_access_key
      changed_when: false
      no_log: true
      when: s3_bucket_odf | bool

    - name: 30.Copy s3 blobs
      ansible.builtin.shell: >
        umask 077 && aws s3 sync --no-verify-ssl
        --endpoint https://$(oc get route s3 -n openshift-storage -o jsonpath='{.spec.host}')
        s3://$(oc get cm -l app=noobaa -n {{ quay_namespace }} -o jsonpath='{.items[0].data.BUCKET_NAME}')
        {{ backup_dir }}/s3_blobs
      environment:
        AWS_ACCESS_KEY_ID: "{{ aws_access_key_id.stdout }}"
        AWS_SECRET_ACCESS_KEY: "{{ aws_secret_access_key.stdout }}"
      changed_when: false
      no_log: true
      when: s3_bucket_odf | bool

    - name: 31.Remove readonly variables from config.yaml
      ansible.builtin.lineinfile:
        path: "{{ backup_dir }}/{{ backup_files.quay_bundle_config }}"
        regexp: '^{{ item.key }}:'
        state: absent
      loop: "{{ quay_readonly_config | dict2items }}"
      tags:
        - readonly_config
        - readonly_remove

    - name: 32.Apply quay_bundle_config.yaml
      ansible.builtin.command:
        cmd: >
          oc set data secret/{{ config_bundle_secret_name.stdout }}
          -n {{ quay_namespace }}
          --from-file=config.yaml={{ backup_dir }}/{{ backup_files.quay_bundle_config }}

    - name: 33.Wait for the Operator to start a new Quay rollout
      shell: >
        oc rollout status deployment/{{ quay_instance }}-quay-app
        -n {{ quay_namespace }} --timeout=5s
      register: rollout_normal_start
      retries: 60
      delay: 5
      until: "'successfully rolled out' not in rollout_normal_start.stdout"
      changed_when: false
      failed_when: false

    - name: 34.Rollout not started
      fail:
        msg: "O Operator não iniciou um novo rollout do deployment {{ quay_instance }}-quay-app, necessario verifificar manualmente."
      when: "'successfully rolled out' in rollout_normal_start.stdout"

    - name: 35.Wait for Quay to start as **Normal**
      shell: >
        oc rollout status deployment/{{ quay_instance }}-quay-app
        -n {{ quay_namespace }} --timeout=5s
      register: rollout_normal_status
      retries: 80
      delay: 5
      until: "'successfully rolled out' in rollout_normal_status.stdout"
      changed_when: false
      failed_when: false

    - name: 36.Rollout not finished
      fail:
        msg: "Rollout do deployment {{ quay_instance }}-quay-app, nao finalizado no tempo esperado, necessario verifificar manualmente."
      when: "'successfully rolled out' not in rollout_normal_status.stdout"

    - name: 37.Validate Quay database dump
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - -c
          - |
              import re
              import sys

              dump_path, expected_name = sys.argv[1:3]
              with open(dump_path, encoding="utf-8") as dump_file:
                  dump = dump_file.read()

              match = re.search(
                  r'^CREATE DATABASE (?:"([^"]+)"|([A-Za-z0-9_.-]+))\s',
                  dump,
                  re.MULTILINE,
              )
              detected_name = (match.group(1) or match.group(2)) if match else ""
              if detected_name != expected_name:
                  raise SystemExit("The dump does not contain the expected Quay database")
              if "-- PostgreSQL database dump complete" not in dump:
                  raise SystemExit("The PostgreSQL dump completion marker was not found")
          - "{{ backup_dir }}/{{ backup_files.quay_database_sql }}"
          - "{{ quay_database_name.stdout }}"
      changed_when: false

    - name: 38.Generate backup checksums
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          umask 077
          find . -type f -not -name SHA256SUMS -exec sha256sum '{}' \; |
            LC_ALL=C sort > SHA256SUMS
        chdir: "{{ backup_dir }}"
        executable: /bin/bash
      changed_when: true

    - name: 39.Protect checksum manifest
      ansible.builtin.file:
        path: "{{ backup_dir }}/SHA256SUMS"
        mode: "0600"

    - name: 40.Validate backup checksums
      ansible.builtin.command:
        cmd: sha256sum --check SHA256SUMS
        chdir: "{{ backup_dir }}"
      changed_when: false
